  <!-- Kiểu dáng của màn hình chờ / màn hình báo lỗi phải nằm ngay trong trang: nếu tệp CSS của game không tải được
       thì vẫn phải đọc được chữ. Đây là lưới an toàn cho lỗi "mở lên chỉ thấy màn hình đen". -->
  <style>html,body{color:#fff7e4;background:#1b1512;height:100%;margin:0;font-family:"Baloo 2",system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;overflow:hidden}#bootload{text-align:center;z-index:60;background:#1b1512;place-items:center;padding:24px;font-size:16px;line-height:1.5;display:grid;position:fixed;top:0;bottom:0;left:0;right:0}#bootload small{opacity:.7;margin-top:.35em;font-size:.82em;display:block}#booterr{z-index:70;background:#120d0af0;place-items:center;padding:20px;display:grid;position:fixed;top:0;bottom:0;left:0;right:0}#booterr[hidden]{display:none}#booterr .box{color:#2a1c12;text-align:center;background:#fff7e4;border:3px solid #2a1c12;border-radius:14px;max-width:30em;padding:16px 18px;box-shadow:0 6px #00000059}#booterr b{font-size:1.15em}#booterr p{margin:.5em 0 1em;font-size:.95em;line-height:1.45}#booterr button{font:inherit;cursor:pointer;color:#2a1c12;background:#ffd24d;border:2px solid #2a1c12;border-bottom-width:4px;border-radius:10px;margin:0 .25em;padding:.5em 1.1em;font-weight:700}#booterr button.plain{background:#fff7e4}#booterr .hint{opacity:.75;margin-top:.8em;font-size:.8em}</style>

<body>
  <canvas id="gl"></canvas>

  <!-- Lưới an toàn: chữ chờ + báo lỗi nằm ngay trong trang, không phụ thuộc tệp JS/CSS của game.
       Trước đây nếu tệp game không tải được (mạng chập chờn, hoặc bộ nhớ đệm cũ của service worker trỏ vào tệp
       đã bị xoá sau lần cập nhật) thì màn hình chỉ còn một màu đen trơn, không nút, không lời báo → tưởng game hỏng. -->
  <div id="bootload">Đang dựng thành phố…<small>Gánh Hàng Đường Phố</small></div>
  <div id="booterr" hidden>
    <div class="box">
      <b>Chưa mở được game</b>
      <p id="bootmsg">Mạng chậm hoặc bản lưu cũ đang chặn tệp game.</p>
      <button id="bootreload">Thử lại</button>
      <button id="bootfix" class="plain">Sửa lỗi tải</button>
      <div class="hint">“Sửa lỗi tải” sẽ xoá bộ nhớ đệm cũ trên máy này. Tiến trình chơi được giữ nguyên.</div>
    </div>
  </div>
  <script>
    (function () {
      var t0 = Date.now(), done = false, timer = 0;
      var $ = function (id) { return document.getElementById(id); };
      // Xoá bộ nhớ đệm + service worker cũ rồi mở lại trang với địa chỉ mới (không dùng lại bản lưu cũ).
      function hardReset() {
        var go = function () { location.replace(location.pathname + '?v=' + Date.now()); };
        try {
          if (!window.caches || !navigator.serviceWorker) return go();
          caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k); }));
          }).then(function () {
            return navigator.serviceWorker.getRegistrations ? navigator.serviceWorker.getRegistrations() : [];
          }).then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }).then(go).catch(go);
        } catch (e) { go(); }
      }
      window.__boot = {
        // Game đã dựng xong ít nhất cái khung → ẩn chữ chờ tĩnh (lớp chờ của game sẽ thay thế).
        stage: function () { done = true; clearTimeout(timer); var l = $('bootload'); if (l) l.style.display = 'none'; },
        // Menu đã lên hình → mọi thứ ổn, không bao giờ báo lỗi nữa.
        ok: function () { window.__boot.stage(); var e = $('booterr'); if (e) e.hidden = true; },
        fail: function (msg) {
          if (window.__gameReady) return;
          var e = $('booterr'); if (!e) return;
          var m = $('bootmsg'); if (m && msg) m.textContent = msg;
          e.hidden = false; var l = $('bootload'); if (l) l.style.display = 'none';
        },
      };
      $('bootreload').onclick = function () { location.reload(); };
      $('bootfix').onclick = hardReset;
      // Tệp game tải hỏng/chặn (404, mất mạng giữa chừng): <script> phát sự kiện error.
      window.addEventListener('error', function (ev) {
        var t = ev.target;
        if (t && t.tagName === 'SCRIPT' && !done) window.__boot.fail('Không tải được tệp game. Kiểm tra mạng rồi bấm “Thử lại”, hoặc bấm “Sửa lỗi tải”.');
      }, true);
      // Quá 15 giây vẫn chưa có khung hình: gần như chắc chắn tệp game không về được.
      timer = setTimeout(function () {
        if (!done) window.__boot.fail('Tải quá 15 giây mà game chưa lên. Bấm “Thử lại”; nếu vẫn vậy thì bấm “Sửa lỗi tải”.');
      }, 15000);
      // Mở bằng ?reset → chủ động xoá bản cũ (dùng khi được dặn "mở kèm ?reset").
      if (/[?&]reset\b/.test(location.search)) hardReset();
    })();
  </script>
